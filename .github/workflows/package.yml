name: Package

# Builds an installable package per OS and smoke-tests the packaged app. The packages are workflow
# artifacts only: nothing is released or tagged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  # No signing secrets exist. This keeps electron-builder from looking for a certificate; the macOS
  # package is signed ad hoc by its own setting in electron-builder.yml.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  macos:
    name: macOS (arm64, dmg)
    # macos-14 does not start for this repository ("configuration not supported"). macos-15 is also
    # Apple Silicon.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package --mac
      - name: Smoke test the packaged app
        run: pnpm test:package
      - name: Package sizes
        run: ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: pixlad-macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64, installer)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package --win
      - name: Smoke test the packaged app
        run: pnpm test:package
      - name: Package sizes
        shell: bash
        run: ls -lh dist/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: pixlad-windows-x64-installer
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Fedora (x64, rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install rpmbuild and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xvfb xauth
      - run: pnpm install --frozen-lockfile
      - run: pnpm package --linux
      - name: Smoke test the packaged app under Xvfb
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' pnpm test:package
      - name: Package sizes and contents
        run: |
          ls -lh dist/*.rpm
          rpm -qip dist/*.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: pixlad-fedora-x64-rpm
          path: dist/*.rpm
          if-no-files-found: error
