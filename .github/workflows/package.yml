name: Package

# Builds an installable package per OS and smoke-tests the packaged app. The packages are workflow
# artifacts only: nothing is released or tagged. The builds are test builds with the prerelease
# version 0.0.0-dev.<run number>, and they never check for updates. Releases come from the Release
# workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-packages.yml
    with:
      version: 0.0.0-dev.${{ github.run_number }}
