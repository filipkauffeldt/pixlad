name: Package

# Builds an installable package per OS and smoke-tests the packaged app. The packages are workflow
# artifacts only: nothing is released or tagged. The builds are test builds with the prerelease
# version 0.0.0-dev.g<short commit sha>, and they never check for updates. Releases come from the Release
# workflow.
# Changes to the landing page or to Markdown docs alone do not touch the app, so they skip this
# workflow.
on:
  pull_request:
    paths-ignore: ['webpage/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['webpage/**', '**.md']
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The g keeps the last part from being all digits, which semver only allows without a
      # leading zero. Actions has no function to cut the sha, so the shell does it.
      - id: version
        run: echo "version=0.0.0-dev.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
